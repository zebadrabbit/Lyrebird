<!-- @dsCard group="Editor" height=132 subtitle="Supported, ignored and unknown" -->
<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-body);padding:16px}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.cell{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.t{font-family:var(--font-mono);font-size:15px;line-height:24px;padding:1px 8px;border-radius:var(--radius-sm)}
.ok{color:var(--tag);background:var(--tag-bg)}.off{color:var(--tag-off);background:var(--tag-off-bg)}
.bad{color:var(--tag-bad);text-decoration:underline wavy;text-underline-offset:3px;padding-inline:0}
</style></head><body><div class="row">
<div class="cell"><span class="lbl">Supported</span><span><span class="t ok">[laugh]</span> <span class="t ok">[sigh]</span></span></div>
<div class="cell"><span class="lbl">Ignored by model</span><span><span class="t off">[whispering]</span></span></div>
<div class="cell"><span class="lbl">Unknown</span><span><span class="t bad">[giggle-snort]</span></span></div>
</div></body></html>
