<!-- @dsCard group="Editor" height=200 subtitle="Speakers, text and tags" -->
<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:var(--ground);padding:16px;font-family:var(--font-body)}
.s{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:16px;font-family:var(--font-mono);font-size:15px;line-height:24px;color:var(--ink);max-width:560px}
.s p{margin:0}.sp{color:var(--speaker);font-weight:500}
.t{color:var(--tag);background:var(--tag-bg);border-radius:var(--radius-sm);padding:1px 6px}
.m{margin-top:8px;font-size:12px;line-height:16px;color:var(--ink-muted);font-family:var(--font-mono)}
</style></head><body><div class="s">
<p><span class="sp">Alice:</span> Did you hear the news?</p>
<p><span class="sp">Bob:</span> No, what happened? <span class="t">[sigh]</span></p>
<p><span class="sp">Alice:</span> They fixed the kettle. <span class="t">[laugh]</span></p>
<p><span class="sp">Built-in:</span> And that was the whole story.</p>
</div><div class="m">Turbo · seed 0 · 24 kHz mono</div></body></html>
