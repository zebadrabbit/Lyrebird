name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # create releases on tags
  actions: read    # lets SignPath read the unsigned artifact

jobs:
  build:
    runs-on: windows-latest
    env:
      LYREBIRD_BUILD_DIR: ${{ runner.temp }}\lyrebird-build
      # Code signing runs on version tags once the SignPath repository variable is set (see README).
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content lyrebird.py -Raw), 'VERSION = "([\d.]+)"').Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME doesn't match VERSION $version in lyrebird.py" }

      - name: Test and build the launcher zip
        shell: pwsh
        run: ./build.ps1

      - name: Upload the unsigned app for signing
        id: unsigned
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Lyrebird-unsigned
          path: ${{ env.LYREBIRD_BUILD_DIR }}\dist\Lyrebird

      - name: Sign Lyrebird.exe (SignPath Foundation)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: lyrebird
          signing-policy-slug: release-signing
          artifact-configuration-slug: default
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600  # time for an approver to approve the request
          output-artifact-directory: ${{ runner.temp }}\signed\Lyrebird

      - name: Check the signature and zip the signed app
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "$env:RUNNER_TEMP\signed\Lyrebird\Lyrebird.exe"
          if ($sig.Status -ne "Valid") { throw "Lyrebird.exe signature is $($sig.Status)" }
          Write-Host "Signed by $($sig.SignerCertificate.Subject)"
          Compress-Archive -Path "$env:RUNNER_TEMP\signed\Lyrebird" -DestinationPath dist/Lyrebird-win64.zip -Force

      - uses: actions/upload-artifact@v7
        with:
          name: Lyrebird-win64
          path: dist/Lyrebird-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE) { gh release create $env:GITHUB_REF_NAME --title "Lyrebird $env:GITHUB_REF_NAME" --generate-notes }
          gh release upload $env:GITHUB_REF_NAME dist/Lyrebird-win64.zip --clobber
